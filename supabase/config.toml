# Supabase local development configuration.
# Run `supabase start` (Supabase CLI) from the repo root to bring up a full
# local stack (Postgres, Auth, Storage, Edge Functions, Studio) using this
# config plus the migrations in supabase/migrations/. See docs/DEPLOYMENT.md.

project_id = "inkwell"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/reset-password"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions]
[functions.ai-assistant]
verify_jwt = true
import_map = "./functions/import_map.json"

[functions.account-delete]
verify_jwt = true
import_map = "./functions/import_map.json"
